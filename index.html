const SECTION_ORDER=["diaCorrida","preCorrida"];
const orderedSectionEntries=d=>[...SECTION_ORDER.filter(k=>d[k]),...Object.keys(d).filter(k=>!SECTION_ORDER.includes(k))].map(k=>[k,d[k]]);
const flat=d=>orderedSectionEntries(d).flatMap(([,s])=>s.platforms.flatMap(p=>p.items));
const pct=(a,b)=>b===0?0:Math.round(a/b*100);
const sClr=p=>p<33?"#C0392B":p<66?B.yellow:B.greenL;
const fmt=d=>d?d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";

function mergeChecklistData(saved){
  if(!saved||Object.keys(saved).length===0)return INITIAL;
  const mandatoryById=new Map();
  Object.values(INITIAL).forEach(section=>{
    section.platforms.forEach(platform=>{
      platform.items.forEach(item=>mandatoryById.set(item.id,item.mandatory));
    });
  });
  const merged={...saved};
  return Object.fromEntries(orderedSectionEntries(INITIAL).map(([sectionKey,initialSection])=>{
    const section=merged[sectionKey]||initialSection;
    return [
    sectionKey,
    {
      ...initialSection,
      ...section,
      platforms:section.platforms?.map(platform=>({
        ...platform,
        items:platform.items?.map(item=>({
          ...item,
          mandatory:mandatoryById.has(item.id)?mandatoryById.get(item.id):item.mandatory,
        }))||[],
      }))||[],
    },
  ];
  }).concat(Object.entries(merged).filter(([sectionKey])=>!SECTION_ORDER.includes(sectionKey))));
}

function Checkbox({done}){
  return(
    <div style={{width:19,height:19,borderRadius:5,flexShrink:0,marginTop:1,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s",background:done?B.greenL:"transparent",border:done?"none":"1.5px solid rgba(255,255,255,.2)"}}>
      {done&&<svg width="10" height="8" viewBox="0 0 10 8"><path d="M1 4L3.5 6.5L9 1" stroke="white" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" fill="none"/></svg>}
    </div>
  );
}

function App(){
  const[data,setData]=useState(INITIAL);
  const[status,setStatus]=useState("booting");
  const[lastSync,setLastSync]=useState(null);
  const[lastUpdatedAt,setLastUpdatedAt]=useState(null);
  const[errMsg,setErrMsg]=useState("");
  const[openSection,setOpenSection]=useState(null);
  const saveTimer=useRef(null);
  const booted=useRef(false);

  useEffect(()=>{
    (async()=>{
      try{const row=await dbLoad();if(row?.data&&Object.keys(row.data).length>0){setData(mergeChecklistData(row.data));setLastUpdatedAt(row.updated_at);}setLastSync(new Date());setStatus("idle");}
      catch(e){setErrMsg(e.message);setStatus("error");}
      finally{booted.current=true;}
    })();
  },[]);

  useEffect(()=>{
    if(!booted.current)return;
    setStatus("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      try{await dbSave(data);setLastSync(new Date());setStatus("saved");setTimeout(()=>setStatus("idle"),2500);}
      catch(e){setErrMsg(e.message);setStatus("error");}
    },1200);
    return()=>clearTimeout(saveTimer.current);
  },[data]);

  useEffect(()=>{
    const id=setInterval(async()=>{
      if(status==="saving"||status==="booting")return;
      try{const row=await dbLoad();if(row?.updated_at&&row.updated_at!==lastUpdatedAt){setData(mergeChecklistData(row.data));setLastUpdatedAt(row.updated_at);setLastSync(new Date());}}
      catch{}
    },5000);
    return()=>clearInterval(id);
  },[status,lastUpdatedAt]);

  const toggle=useCallback((sk,pid,iid)=>{
    setData(prev=>{
      const sec={...prev[sk]};
      sec.platforms=sec.platforms.map(p=>p.id!==pid?p:{...p,items:p.items.map(i=>i.id===iid?{...i,done:!i.done}:i)});
      return{...prev,[sk]:sec};
    });
  },[]);

  const manualSync=async()=>{
    setStatus("booting");
    try{const row=await dbLoad();if(row?.data){setData(mergeChecklistData(row.data));setLastUpdatedAt(row.updated_at);}setLastSync(new Date());setStatus("idle");}
    catch(e){setErrMsg(e.message);setStatus("error");}
  };

  const all=flat(data),done=all.filter(i=>i.done).length,total=all.length,progress=pct(done,total),pc=sClr(progress);

    booting:{dot:B.yellow,  pulse:true, label:"Conectando…"},
    idle:   {dot:B.greenL,  pulse:false,label:`Atualizado ${fmt(lastSync)}`},
    saving: {dot:B.blueL,   pulse:true, label:"Salvando…"},
    saved:  {dot:B.greenL,  pulse:false,label:`Salvo ${fmt(lastSync)}`},
    error:  {dot:"#C0392B", pulse:false,label:`Erro: ${errMsg}`},
  }[status];

    <div style={{minHeight:"100vh",background:"#060911",padding:"24px 20px"}}>
    <div style={{maxWidth:1320,margin:"0 auto",background:"#0C1018",borderRadius:18,border:"1px solid rgba(255,255,255,.06)",overflow:"hidden",boxShadow:"0 8px 60px rgba(0,0,0,.5)"}}>

      {/* ── HERO ── */}
      <header style={{position:"relative",overflow:"hidden",background:"linear-gradient(155deg,#0F1825 0%,#0C1018 55%)",borderBottom:"1px solid rgba(255,255,255,.07)"}}>

        {/* Arco decorativo (cores do gradiente do SVG) */}
        <div style={{position:"absolute",right:-80,top:-80,width:420,height:420,borderRadius:"50%",background:"radial-gradient(circle,rgba(245,179,32,.07) 0%,transparent 65%)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",left:-60,bottom:-60,width:300,height:300,borderRadius:"50%",background:"radial-gradient(circle,rgba(13,119,168,.08) 0%,transparent 65%)",pointerEvents:"none"}}/>

        {/* Top bar — logo + sync */}
        <div style={{position:"relative",zIndex:2,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"20px 36px",borderBottom:"1px solid rgba(255,255,255,.05)",flexWrap:"wrap",gap:14}}>
          {/* Logo horizontal real */}
          <img src={LOGO_H} alt="200 Anos Câmara dos Deputados" style={{height:50,width:"auto",flexShrink:0}}/>

          {/* Sync pill */}
          <div style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,padding:"9px 14px"}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:SM.dot,display:"inline-block",flexShrink:0,boxShadow:SM.pulse?`0 0 10px ${SM.dot}`:"none",animation:SM.pulse?"pulse 1.1s ease-in-out infinite":"none"}}/>

        </div>

        {/* Título */}

        </div>
      </header>

      {/* Boot overlay */}

            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <span style={{background:`${B.greenL}18`,color:B.greenL,padding:"3px 12px",borderRadius:99,fontSize:"0.72rem",fontWeight:600}}>✓ {done} concluídos</span>

              <span style={{background:`${B.yellow}22`,color:B.yellowL,padding:"3px 12px",borderRadius:99,fontSize:"0.72rem"}}>◈ {total} total</span>
            </div>
          </div>
          <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"4.2rem",fontWeight:900,lineHeight:1,color:pc,transition:"color .5s",letterSpacing:"-3px"}}>{progress}<span style={{fontSize:"2rem",opacity:.45}}>%</span></span>
        </div>
        <div style={{height:8,background:"rgba(255,255,255,.07)",borderRadius:99,overflow:"hidden"}}>
          <div style={{height:"100%",borderRadius:99,width:`${progress}%`,background:`linear-gradient(90deg,${B.blue},${pc})`,transition:"width .6s cubic-bezier(.4,0,.2,1)",boxShadow:`0 0 18px ${pc}44`}}/>
        </div>
      </div>

      {/* Patrocínio */}
      <div style={{padding:"9px 36px",background:`${B.yellow}08`,borderBottom:`1px solid ${B.yellow}20`,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{width:6,height:6,borderRadius:"50%",background:B.yellowL,display:"inline-block",flexShrink:0}}/>
        <span style={{fontSize:"0.71rem",color:"#6070A0"}}>Itens <strong style={{color:B.yellowL}}>obrigatórios</strong> são contrapartida de patrocínio — {SPONSORS}</span>
      </div>

      {/* ── SECTIONS ── */}
      {orderedSectionEntries(data).map(([sk,section])=>{
        const items=section.platforms.flatMap(p=>p.items);
        const sd=items.filter(i=>i.done).length,st=items.length,sp=pct(sd,st);
        const acc=section.accent||B.green;
        const isOpen=openSection===sk;
        return(

                <div style={{width:4,height:34,background:acc,borderRadius:3,boxShadow:`0 0 12px ${acc}88`,flexShrink:0}}/>

                  <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"1.55rem",fontWeight:900,letterSpacing:"4px",textTransform:"uppercase",color:"#F0F4FC",margin:0,lineHeight:1}}>{section.label}</h2>

      <section style={{padding:"32px 36px",borderBottom:"1px solid rgba(255,255,255,.04)"}}>
        <div onClick={()=>setOpenSection(openSection==='equipe'?null:'equipe')} style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:openSection==='equipe'?22:0,cursor:"pointer",userSelect:"none"}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:4,height:34,background:B.yellowL,borderRadius:3,boxShadow:`0 0 12px ${B.yellow}80`}}/>
            <div>
              <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"1.55rem",fontWeight:900,letterSpacing:"4px",textTransform:"uppercase",color:"#F0F4FC",margin:0}}>EQUIPE ESCALADA</h2>
              <p style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"0.65rem",color:"#3A4A6A",letterSpacing:"2px",marginTop:4,textTransform:"uppercase"}}>17 de maio de 2025</p>
            </div>
          </div>
          <span style={{fontSize:"1.1rem",color:B.yellowL,display:"inline-block",transition:"transform .3s",transform:openSection==='equipe'?"rotate(180deg)":"rotate(0deg)",lineHeight:1}}>▾</span>
        </div>
        {openSection==='equipe'&&<>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(212px,1fr))",gap:11,marginBottom:18}}>
            {EQUIPE.map((m,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:12,background:"rgba(255,255,255,.025)",border:"1px solid rgba(255,255,255,.06)",borderRadius:12,padding:"11px 13px"}}>
                <div style={{width:35,height:35,borderRadius:"50%",background:`linear-gradient(135deg,${B.blue},${B.greenL})`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Barlow Condensed',sans-serif",fontSize:"1rem",fontWeight:800,color:"white",flexShrink:0}}>{m.name[0]}</div>
                <div>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:"0.95rem",color:"#D8E4F4"}}>{m.name}</div>
                  <div style={{fontSize:"0.63rem",color:"#3A4A6A",marginTop:2,lineHeight:1.3}}>{m.role}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:8,padding:"13px 16px",background:`${B.greenL}08`,border:`1px solid ${B.greenL}22`,borderRadius:12}}>
            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:"0.9rem",color:B.greenL,letterSpacing:"2px",textTransform:"uppercase",marginRight:6}}>🏃 Quem vai correr:</span>
            {CORREDORES.map((c,i)=>(
              <span key={i} style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.08)",padding:"3px 11px",borderRadius:99,fontSize:"0.74rem",color:"#B0C0DC"}}>{c}</span>
            ))}
          </div>
        </>}
      </section>

      {/* ── FOOTER ── */}
      <footer style={{padding:"20px 36px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:14,borderTop:"1px solid rgba(255,255,255,.05)",background:"rgba(0,0,0,.3)"}}>
        <img src={LOGO_H} alt="200 Anos Câmara dos Deputados" style={{height:28,width:"auto",opacity:.7}}/>
        <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"0.65rem",letterSpacing:"2px",color:B.greenL,textTransform:"uppercase",fontWeight:600}}>⚡ SYNC A CADA 5s · SUPABASE</span>
      </footer>
    </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
