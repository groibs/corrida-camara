        [
          ...SECTION_ORDER.filter((k) => d[k]),
          ...Object.keys(d).filter((k) => !SECTION_ORDER.includes(k)),
        ].map((k) => [k, d[k]]);
      const flat = (d) =>
        orderedSectionEntries(d).flatMap(([, s]) =>
          s.platforms.flatMap((p) => p.items),
        );
      const pct = (a, b) => (b === 0 ? 0 : Math.round((a / b) * 100));
      const sClr = (p) => (p < 33 ? "#C0392B" : p < 66 ? B.yellow : B.greenL);
      const fmt = (d) =>
        d
          ? d.toLocaleTimeString("pt-BR", {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            })
          : "";

      function mergeChecklistData(saved) {
        if (!saved || Object.keys(saved).length === 0) return INITIAL;
        const mandatoryById = new Map();
        Object.values(INITIAL).forEach((section) => {
          section.platforms.forEach((platform) => {
            platform.items.forEach((item) =>
              mandatoryById.set(item.id, item.mandatory),
            );
          });
        });
        const merged = { ...saved };
        return Object.fromEntries(
          orderedSectionEntries(INITIAL)
            .map(([sectionKey, initialSection]) => {
              const section = merged[sectionKey] || initialSection;
              return [
                sectionKey,
                {
                  ...initialSection,
                  ...section,
                  platforms:
                    section.platforms?.map((platform) => ({
                      ...platform,
                      items:
                        platform.items?.map((item) => ({
                          ...item,
                          mandatory: mandatoryById.has(item.id)
                            ? mandatoryById.get(item.id)
                            : item.mandatory,
                        })) || [],
                    })) || [],
                },
              ];
            })
            .concat(
              Object.entries(merged).filter(
                ([sectionKey]) => !SECTION_ORDER.includes(sectionKey),
              ),
            ),
        );
      }

        const [lastSync, setLastSync] = useState(null);
        const [lastUpdatedAt, setLastUpdatedAt] = useState(null);
        const [errMsg, setErrMsg] = useState("");
        const saveTimer = useRef(null);
        const booted = useRef(false);

        useEffect(() => {
          (async () => {
            try {
              const row = await dbLoad();
              if (row?.data && Object.keys(row.data).length > 0) {
                setData(mergeChecklistData(row.data));
                setLastUpdatedAt(row.updated_at);
              }
              setLastSync(new Date());
              setStatus("idle");
            } catch (e) {
              setErrMsg(e.message);
              setStatus("error");
            } finally {
              booted.current = true;
            }
          })();
        }, []);

        useEffect(() => {
          if (!booted.current) return;
          setStatus("saving");
          clearTimeout(saveTimer.current);
          saveTimer.current = setTimeout(async () => {
            try {
              await dbSave(data);
              setLastSync(new Date());
              setStatus("saved");
              setTimeout(() => setStatus("idle"), 2500);
            } catch (e) {
              setErrMsg(e.message);
              setStatus("error");
            }

          return () => clearTimeout(saveTimer.current);

              const row = await dbLoad();

                setData(mergeChecklistData(row.data));
                setLastUpdatedAt(row.updated_at);
                setLastSync(new Date());

          return () => clearInterval(id);

                    items: p.items.map((i) =>

            return { ...prev, [sk]: sec };

          saved: {

                    <div className="platform-grid">

                                </div>
                              </div>
                              <div

                                {pd}/{pt}

                            </div>
                            <div className="platform-track">
                              <div

                                  width: `${pp}%`,
                                  "--badge-color": badge,
                                }}
                              />
                            </div>
                            <ul className="task-list">
                              {platform.items.map((item) => (
                                <li

                            </ul>
