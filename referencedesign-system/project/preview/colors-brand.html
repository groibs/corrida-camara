<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 24px; }
  .pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; width: 100%; }
  .sw {
    aspect-ratio: 1 / 1;
    border-radius: 999px;
    display: block;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .swatch {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .swatch .name {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--fg-1);
  }
  .swatch .hex {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--fg-3);
  }
</style>
</head>
<body>
  <div class="pc-card col">
    <div class="pal">
      <div class="swatch"><span class="sw" style="background:var(--brand-lime);"></span><span class="name">Lime</span><span class="hex">#A3EF15</span></div>
      <div class="swatch"><span class="sw" style="background:var(--brand-cyan);"></span><span class="name">Cyan</span><span class="hex">#22ACDD</span></div>
      <div class="swatch"><span class="sw" style="background:var(--brand-orange);"></span><span class="name">Orange</span><span class="hex">#F58A1F</span></div>
      <div class="swatch"><span class="sw" style="background:var(--brand-magenta);"></span><span class="name">Magenta</span><span class="hex">#E9118C</span></div>
      <div class="swatch"><span class="sw" style="background:var(--brand-purple);"></span><span class="name">Purple</span><span class="hex">#5C2D90</span></div>
      <div class="swatch"><span class="sw" style="background:var(--brand-black);"></span><span class="name">Black</span><span class="hex">#131313</span></div>
    </div>
  </div>
</body>
</html>
