<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 18px 24px; flex-direction: column; align-items: stretch; gap: 14px; justify-content: center; }
  .eb {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .eb::before {
    content: "";
    width: 22px; height: 2px;
    background: currentColor;
  }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="pc-card">
    <div class="row">
      <span class="eb" style="color:var(--brand-black);">Percurso</span>
      <span class="eb" style="color:var(--brand-magenta);">Inscrições</span>
      <span class="eb" style="color:var(--brand-purple);">Resultados</span>
    </div>
    <div class="row">
      <span class="eb" style="color:var(--fg-3);">Patrocinadores</span>
      <span class="eb" style="color:var(--brand-orange);">Kit do corredor</span>
    </div>
  </div>
</body>
</html>
