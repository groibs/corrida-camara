<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 20px 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; }
  .role {
    display: flex; flex-direction: column; gap: 8px;
  }
  .role .swatch {
    height: 64px;
    border: 1px solid var(--line-1);
  }
  .role .name {
    font-family: var(--font-body); font-weight: 700; font-size: 11px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .role .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="pc-card">
    <div class="row">
      <div class="role"><span class="swatch" style="background:#131313;"></span><span class="name">fg-1 / text</span><span class="hex">#131313</span></div>
      <div class="role"><span class="swatch" style="background:#2e2e2e;"></span><span class="name">fg-2</span><span class="hex">#2E2E2E</span></div>
      <div class="role"><span class="swatch" style="background:#585858;"></span><span class="name">fg-3 / meta</span><span class="hex">#585858</span></div>
      <div class="role"><span class="swatch" style="background:#8a8a8a;"></span><span class="name">fg-4 / hint</span><span class="hex">#8A8A8A</span></div>
    </div>
  </div>
</body>
</html>
