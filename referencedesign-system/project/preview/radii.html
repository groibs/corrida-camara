<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 24px; gap: 22px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box {
    width: 80px; height: 80px;
    background: var(--brand-lime);
    border: 1.5px solid var(--brand-black);
  }
  .nm { font-family: var(--font-body); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .v  { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="pc-card">
    <div class="item"><div class="box" style="border-radius:0;"></div><span class="nm">Square</span><span class="v">0</span></div>
    <div class="item"><div class="box" style="border-radius:4px;"></div><span class="nm">SM</span><span class="v">4px</span></div>
    <div class="item"><div class="box" style="border-radius:8px;"></div><span class="nm">MD · inputs</span><span class="v">8px</span></div>
    <div class="item"><div class="box" style="border-radius:16px;"></div><span class="nm">LG</span><span class="v">16px</span></div>
    <div class="item"><div class="box" style="border-radius:999px;"></div><span class="nm">Pill · buttons</span><span class="v">999px</span></div>
  </div>
</body>
</html>
