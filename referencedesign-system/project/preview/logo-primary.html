<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 16px 24px; }
  .pc-logo { height: 110px; width: auto; display: block; }
  .pc-meta-block { display: flex; flex-direction: column; gap: 6px; }
  .pc-meta-block .pc-title {
    font-family: var(--font-headline);
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--fg-1);
  }
</style>
</head>
<body>
  <div class="pc-card">
    <img class="pc-logo" src="../assets/logos/logo-primary.png" alt="Corrida da Câmara primary logo">
    <div class="pc-meta-block">
      <div class="pc-label">Primary lockup</div>
      <div class="pc-title">Logo · Green + Magenta</div>
      <div class="pc-mono">assets/logos/logo-primary.png · 1:1 lockup, black wordmark on white</div>
    </div>
  </div>
</body>
</html>
