<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 22px 24px; flex-wrap: wrap; gap: 10px 12px; }
  .chip {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
  }
  .chip-lime    { background: var(--brand-lime);    color: var(--brand-black); }
  .chip-magenta { background: var(--brand-magenta); color: #fff; }
  .chip-cyan    { background: var(--brand-cyan);    color: var(--brand-black); }
  .chip-orange  { background: var(--brand-orange);  color: var(--brand-black); }
  .chip-purple  { background: var(--brand-purple);  color: #fff; }
  .chip-out     { background: transparent; color: var(--brand-black); box-shadow: inset 0 0 0 1.5px var(--brand-black); }
  .chip-ink     { background: var(--brand-black); color: var(--brand-lime); }
  .chip .dot { width: 7px; height: 7px; border-radius: 99px; background: currentColor; }
</style>
</head>
<body>
  <div class="pc-card">
    <span class="chip chip-lime">5K</span>
    <span class="chip chip-magenta">10K</span>
    <span class="chip chip-cyan">Kids 1K</span>
    <span class="chip chip-orange">Caminhada</span>
    <span class="chip chip-purple">Cadeirantes</span>
    <span class="chip chip-out">Em breve</span>
    <span class="chip chip-ink"><span class="dot"></span> Inscrições abertas</span>
    <span class="chip chip-out">Esgotado</span>
  </div>
</body>
</html>
