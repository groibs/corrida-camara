<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 24px; flex-wrap: wrap; gap: 16px; align-items: center; }
  .btn {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 14px 22px;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    line-height: 1;
  }
  .btn-primary {
    background: var(--brand-lime);
    color: var(--brand-black);
    box-shadow: 4px 4px 0 var(--brand-black);
    transition: transform 120ms var(--ease-sport), box-shadow 120ms var(--ease-sport);
  }
  .btn-primary:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--brand-black); }
  .btn-secondary {
    background: #fff;
    color: var(--brand-black);
    box-shadow: inset 0 0 0 2px var(--brand-black);
  }
  .btn-tertiary {
    background: transparent;
    color: var(--brand-magenta);
    padding-left: 0; padding-right: 0;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
  }
  .btn-disabled {
    background: var(--bg-3);
    color: var(--fg-4);
    cursor: not-allowed;
  }
  .btn .arr { font-size: 18px; }
</style>
</head>
<body>
  <div class="pc-card">
    <button class="btn btn-primary">Inscrever-se <span class="arr">→</span></button>
    <button class="btn btn-secondary">Ver percurso</button>
    <button class="btn btn-tertiary">Baixar regulamento</button>
    <button class="btn btn-disabled">Esgotado</button>
  </div>
</body>
</html>
