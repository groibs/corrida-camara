<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 20px 24px; gap: 28px; }
  .specimen {
    font-family: var(--font-body);
    flex: 1;
  }
  .specimen p { margin: 0 0 6px; line-height: 1.45; font-size: 14px; color: var(--fg-1); }
  .specimen .lede { font-size: 17px; font-weight: 500; }
  .meta { display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
  .meta .lbl {
    font-family: var(--font-body); font-weight: 700; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3);
  }
  .meta .row { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style>
</head>
<body>
  <div class="pc-card">
    <div class="specimen">
      <p class="lede">Corre com a gente — 5K e 10K pelas ruas da cidade.</p>
      <p>Largada às 7h em frente à C&acirc;mara Municipal. Café, &aacute;gua e
      medalha para todo mundo que cruzar a linha. Inscrições abertas até
      sexta-feira.</p>
    </div>
    <div class="meta">
      <div class="lbl">Body · Barlow</div>
      <div class="row">400 / 500 / 600 / 700</div>
      <div class="row">14 / 16 / 18 px</div>
      <div class="row">lh 1.45 – 1.55</div>
    </div>
  </div>
</body>
</html>
