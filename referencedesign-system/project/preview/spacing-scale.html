<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 24px; align-items: flex-end; gap: 16px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar {
    background: var(--brand-black);
    width: 4px;
  }
  .step .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .step .nm { font-family: var(--font-body); font-weight: 700; font-size: 11px; }
</style>
</head>
<body>
  <div class="pc-card">
    <div class="step"><div class="bar" style="width:4px; height:4px;"></div><span class="nm">space-1</span><span class="lbl">4</span></div>
    <div class="step"><div class="bar" style="width:8px; height:8px;"></div><span class="nm">space-2</span><span class="lbl">8</span></div>
    <div class="step"><div class="bar" style="width:12px; height:12px;"></div><span class="nm">space-3</span><span class="lbl">12</span></div>
    <div class="step"><div class="bar" style="width:16px; height:16px;"></div><span class="nm">space-4</span><span class="lbl">16</span></div>
    <div class="step"><div class="bar" style="width:24px; height:24px;"></div><span class="nm">space-5</span><span class="lbl">24</span></div>
    <div class="step"><div class="bar" style="width:32px; height:32px;"></div><span class="nm">space-6</span><span class="lbl">32</span></div>
    <div class="step"><div class="bar" style="width:48px; height:48px;"></div><span class="nm">space-7</span><span class="lbl">48</span></div>
    <div class="step"><div class="bar" style="width:64px; height:64px;"></div><span class="nm">space-8</span><span class="lbl">64</span></div>
    <div class="step"><div class="bar" style="width:96px; height:96px;"></div><span class="nm">space-9</span><span class="lbl">96</span></div>
  </div>
</body>
</html>
