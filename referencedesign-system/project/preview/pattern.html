<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 0; align-items: stretch; min-height: 220px; }
  .tile {
    flex: 1;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
  }
  .a { background-color: #fff;                 background-image: url('../assets/pattern-green-pink.png'); }
  .b { background-color: var(--brand-cyan);    background-image: url('../assets/pattern-green-purple.png'); }
  .c { background-color: var(--brand-lime);    background-image: url('../assets/pattern-orange-purple.png'); }
</style>
</head>
<body>
  <div class="pc-card">
    <div class="tile a"></div>
    <div class="tile b"></div>
    <div class="tile c"></div>
  </div>
</body>
</html>
