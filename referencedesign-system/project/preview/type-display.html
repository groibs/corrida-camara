<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .pc-card { padding: 16px 24px; align-items: flex-end; gap: 22px; }
  .spec {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 96px;
    line-height: 0.85;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--brand-black);
  }
  .spec .accent { color: var(--brand-lime); }
  .meta { display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px; }
  .meta .lbl {
    font-family: var(--font-body); font-weight: 700; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3);
  }
  .meta .row {
    font-family: var(--font-body); font-size: 12px; color: var(--fg-2);
  }
</style>
</head>
<body>
  <div class="pc-card">
    <div class="spec">C&Acirc;<span class="accent">M</span>ARA</div>
    <div class="meta">
      <div class="lbl">Display · Hero</div>
      <div class="row">Big Shoulders Display · 900</div>
      <div class="row">96px · ls -1% · lh 0.85</div>
      <div class="row">ALWAYS UPPERCASE</div>
    </div>
  </div>
</body>
</html>
